<text x="40" y="71" font-size="12" fill="#52514e">AUC</text>
<rect x="82" y="62" width="10" height="10" rx="2" fill="#eb6834"/>
<text x="98" y="71" font-size="12" fill="#52514e">Sensitivity</text>
