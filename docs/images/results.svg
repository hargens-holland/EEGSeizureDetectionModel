<text x="218" y="112.5" font-size="11.5" fill="#eb6834" font-weight="600" font-variant-numeric="tabular-nums">0.000</text>
<text x="196" y="156.5" font-size="12.5" fill="#0b0b0b" text-anchor="end">SVM (RBF)</text>
<path d="M210.0 137.0 H482.7 A4 4 0 0 1 486.7 141.0 V147.0 A4 4 0 0 1 482.7 151.0 H210.0 Z" fill="#2a78d6"/>
<text x="494.7" y="148.5" font-size="11.5" fill="#52514e" font-variant-numeric="tabular-nums">0.567</text>
<rect x="210" y="154" width="2" height="14" fill="#eb6834"/>
<text x="218" y="165.5" font-size="11.5" fill="#eb6834" font-weight="600" font-variant-numeric="tabular-nums">0.000</text>
