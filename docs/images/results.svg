<rect x="210" y="313" width="2" height="14" fill="#eb6834"/>
<text x="218" y="324.5" font-size="11.5" fill="#eb6834" font-weight="600" font-variant-numeric="tabular-nums">0.000</text>
<text x="24" y="390" font-size="11.5" fill="#898781">Sensitivity is 0.000 for all five models &#8212; not one seizure window was ever predicted positive.</text>
