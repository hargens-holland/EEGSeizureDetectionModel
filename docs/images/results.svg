<text x="210.0" y="351" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">0.00</text>
<line x1="332.0" y1="74" x2="332.0" y2="333" stroke="#e1e0d9" stroke-width="1"/>
<text x="332.0" y="351" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">0.25</text>
<line x1="454.0" y1="74" x2="454.0" y2="333" stroke="#e1e0d9" stroke-width="1"/>
<text x="454.0" y="351" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">0.50</text>
<line x1="576.0" y1="74" x2="576.0" y2="333" stroke="#e1e0d9" stroke-width="1"/>
<text x="576.0" y="351" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">0.75</text>
<line x1="698.0" y1="74" x2="698.0" y2="333" stroke="#e1e0d9" stroke-width="1"/>
<text x="698.0" y="351" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">1.00</text>
<text x="196" y="103.5" font-size="12.5" fill="#0b0b0b" text-anchor="end">Logistic Regression</text>
<path d="M210.0 84.0 H452.9 A4 4 0 0 1 456.9 88.0 V94.0 A4 4 0 0 1 452.9 98.0 H210.0 Z" fill="#2a78d6"/>
<text x="464.9" y="95.5" font-size="11.5" fill="#52514e" font-variant-numeric="tabular-nums">0.506</text>
