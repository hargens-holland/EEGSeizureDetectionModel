<text x="518.1" y="201.5" font-size="11.5" fill="#52514e" font-variant-numeric="tabular-nums">0.615</text>
<rect x="210" y="207" width="2" height="14" fill="#eb6834"/>
<text x="218" y="218.5" font-size="11.5" fill="#eb6834" font-weight="600" font-variant-numeric="tabular-nums">0.000</text>
<text x="196" y="262.5" font-size="12.5" fill="#0b0b0b" text-anchor="end">2D CNN (spectrogram)</text>
<path d="M210.0 243.0 H682.3 A4 4 0 0 1 686.3 247.0 V253.0 A4 4 0 0 1 682.3 257.0 H210.0 Z" fill="#2a78d6"/>
